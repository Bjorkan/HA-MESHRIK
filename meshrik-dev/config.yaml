name: "MESHRIK - Bleeding Edge"
version: "2026.10.16.39"
slug: "meshrik-dev"
description: "Experimental MESHRIK build tracking every successful main push; may be unstable or broken"
url: "https://github.com/Bjorkan/HA-MESHRIK"
stage: experimental
arch:
  - amd64
  - aarch64
image: "ghcr.io/bjorkan/ha-meshrik/meshrik-app-dev"
ingress: true
ingress_port: 8000
ingress_stream: true
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Web interface port (for external access via reverse proxy)
panel_icon: "mdi:human-greeting-proximity"
panel_title: "MESHRIK - Bleeding Edge"
hassio_api: true
services:
  - mqtt:want
bluetooth: true
uart: true
map:
  - data:rw
  - share:rw
options:
  serial_port: ""
  serial_baudrate: 115200
  tcp_host: ""
  tcp_port: 5000
  ble_address: ""
  ble_pin: ""
  log_level: "INFO"
  disable_bots: false
  basic_auth_username: ""
  basic_auth_password: ""
  enable_message_poll_fallback: false
  force_channel_slot_reconfigure: false
  skip_post_connect_sync: false
  startup_policy: "sync"
  passive_startup: false
  startup_export_private_key: false
  startup_sync_clock: false
  startup_apply_flood_scope: false
  startup_send_advertisement: false
  startup_drain_messages: false
  startup_reconcile_contacts: false
  startup_clear_channel_slots: false
  startup_allow_periodic_offload: false
  startup_enable_telemetry_collection: false
  auto_reboot_on_clock_skew: false
  login_response_timeout_seconds: 5
  http_startup_timeout_seconds: 120
schema:
  serial_port: str?
  serial_baudrate: int
  tcp_host: str?
  tcp_port: int
  ble_address: str?
  ble_pin: str?
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  disable_bots: bool
  basic_auth_username: str?
  basic_auth_password: str?
  enable_message_poll_fallback: bool
  force_channel_slot_reconfigure: bool
  skip_post_connect_sync: bool
  startup_policy: list(passive|sync|full)
  passive_startup: bool
  startup_export_private_key: bool
  startup_sync_clock: bool
  startup_apply_flood_scope: bool
  startup_send_advertisement: bool
  startup_drain_messages: bool
  startup_reconcile_contacts: bool
  startup_clear_channel_slots: bool
  startup_allow_periodic_offload: bool
  startup_enable_telemetry_collection: bool
  auto_reboot_on_clock_skew: bool
  login_response_timeout_seconds: int
  http_startup_timeout_seconds: int(30,600)
