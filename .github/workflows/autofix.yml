name: autofix.ci

on:
  pull_request:
  push:
    branches: [main]

# autofix.ci uses its installed GitHub App to push fixes, including to fork PRs.
# The workflow itself needs only read access.
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Format Markdown, YAML and JSON with Prettier
        run: |
          npx --yes prettier@3.9.10 --write \
            README.md repository.yaml \
            'meshrik/**/*.{md,json,yaml}' \
            'meshrik-dev/**/*.{md,json,yaml}' \
            'tests/**/*.md'

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      # Both wrappers must remain identical (checked by validate.yml).
      # Do not touch .github/: autofix.ci cannot commit changes there.
      - name: Format shell scripts with shfmt
        run: |
          shfmt -w \
            meshrik/run.sh meshrik-dev/run.sh \
            tests/test-publication.sh tests/test-run.sh

      - name: Apply automatic fixes
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
